# Willo's web shell, deployed as a Cloudflare Worker serving static assets —
# not Cloudflare Pages. Pages always additionally serves <project>.pages.dev
# with no way to switch it off, which has already caused two real incidents
# elsewhere at Oxy (Alia, Mention): the .pages.dev origin served a
# byte-identical deployment outside the CORS allowlist. Willo has no separate
# backend to reverse-proxy behind (unlike Mention's shell.mention.earth), so
# there's no access-gate script here — just the custom domain, with no
# workers.dev/preview fallback name to leak.
name = "willo-frontend"
compatibility_date = "2026-09-14"
main = "worker.ts"

# No `willo-frontend.<subdomain>.workers.dev` and no per-version preview URL —
# willo.sh is the only name this deployment answers to.
workers_dev = false
preview_urls = false

# `expo export --platform web` emits one index.html plus hashed assets (a
# client-routed SPA, not per-route static HTML), so the SPA fallback below is
# what makes a deep link (e.g. /devices) work on a hard refresh.
#
# `binding = "ASSETS"` is what makes `worker.ts` able to call `env.ASSETS.fetch`
# instead of the asset serve happening implicitly with no script at all — the
# HTTP->HTTPS redirect in `worker.ts` has to run before every other request.
#
# `run_worker_first = true` is required for that: without it, Cloudflare's
# default behavior serves a request that matches a static asset (e.g. `/`)
# DIRECTLY, never invoking `worker.ts` at all — verified live, the redirect
# had no effect on `http://willo.sh/` until this was added.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[routes]]
pattern = "willo.sh"
custom_domain = true
