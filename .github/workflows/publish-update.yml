# Oxy Updates: publishes the OTA update of Willo and of Frame by Willo on every
# push to main (oxy @oxy.so/ship templates/publish-update.yml).
#
# No secret. Authentication is GitHub trusted publishing (oxy ADR 0057): the job
# asks GitHub for an OIDC token addressed to https://api.oxy.so, and oxy-api
# exchanges it for a five-minute `updates:publish` token of Willo's application,
# registered for this repository, `refs/heads/main` and THIS file's path. Pull
# requests never publish.
#
# Both apps are Willo's application (one client id); each binary polls its own
# channel (`withOxyUpdates`), so the frame's bundles never reach the Willo app
# nor Willo's a frame. The export uses the same environment as the native build:
# each app's eas.json `production` env (EXPO_PUBLIC_* only), the env oxy's
# android-release.yml builds the binary with.

name: Publish OTA update

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
      - 'packages/frame/**'
      - 'packages/ui/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/publish-update.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: oxy-updates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      OXY_SHIP_CLIENT_ID: oxy_dk_fb8d8c425643f2bd3983386674e9704d81746295d0a3345b
      OXY_API_URL: https://api.oxy.so
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Expo SDK 58's CLI supports Node 22.13+ / 24.3+ only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: bun install --frozen-lockfile --minimum-release-age=0

      # The update's message is the commit's subject: Oxy Updates caps it at 500
      # UTF-16 units, which a squash-merged commit's full body exceeds. 200
      # characters (counted as characters under C.UTF-8) stay under the cap
      # whatever they are.
      - name: Update message
        env:
          LC_ALL: C.UTF-8
        run: |
          subject="$(git log -1 --format=%s)"
          echo "SHIP_MESSAGE=${subject:0:200}" >> "$GITHUB_ENV"

      - name: Publish Willo (channel production)
        working-directory: packages/frontend
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do export "$key=$value"; done < <(jq -r '.build.production.env | to_entries[] | "\(.key)=\(.value)"' eas.json)
          bunx --no-install oxy-ship publish \
            --channel production \
            --platform all \
            --git-commit "$GITHUB_SHA" \
            --message "$SHIP_MESSAGE"

      # The frame is Android and web only: there is no iOS bundle to publish.
      - name: Publish Frame by Willo (channel frame-production)
        working-directory: packages/frame
        run: |
          set -euo pipefail
          while IFS='=' read -r key value; do export "$key=$value"; done < <(jq -r '.build.production.env | to_entries[] | "\(.key)=\(.value)"' eas.json)
          bunx --no-install oxy-ship publish \
            --channel frame-production \
            --platform android \
            --git-commit "$GITHUB_SHA" \
            --message "$SHIP_MESSAGE"
