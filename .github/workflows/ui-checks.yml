name: UI checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ui-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test tests
      - run: bun run typecheck
      - name: Export the real Expo web app
        working-directory: packages/frontend
        run: bunx expo export --platform web
      - name: Install isolated browser QA tooling
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exercise household screens in the real web export
        run: python tests/household-browser.py
      - name: Upload household screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: household-web-review
          path: household-web-review/
          if-no-files-found: ignore
          retention-days: 14
