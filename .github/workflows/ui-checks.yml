name: UI checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ui-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun test tests
      - run: bun run typecheck
      - name: Export the real Expo web app
        working-directory: packages/frontend
        run: bunx expo export --platform web
