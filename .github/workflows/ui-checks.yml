name: UI checks

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Expo SDK 58's CLI supports Node 22.13+ / 24.3+ only; pin a supported
      # major instead of trusting the runner image's default Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Biome (format + lint)
        run: bunx biome ci .
      - name: ESLint (Expo rules Biome lacks)
        run: bun run --cwd packages/frontend lint && bun run --cwd packages/frame lint
      - run: bun test ./tests
      - run: bun run typecheck
      - name: Export the real Expo web app
        working-directory: packages/frontend
        run: bunx expo export --platform web
      - name: Export the frame's web build
        working-directory: packages/frame
        run: bunx expo export --platform web
        env:
          # The frame's config refuses to build without Willo's public client
          # id (it has no fallback identity); the same values deploy-frame.yml
          # builds with.
          EXPO_PUBLIC_OXY_API_URL: https://api.oxy.so
          EXPO_PUBLIC_OXY_CLIENT_ID: oxy_dk_fb8d8c425643f2bd3983386674e9704d81746295d0a3345b
          EXPO_PUBLIC_OXY_AUTH_REDIRECT_URI: https://frame.willo.sh
          EXPO_PUBLIC_WILLO_API_URL: https://api.willo.sh
          EXPO_PUBLIC_CLARITY_API_URL: https://api.clarity.surf
