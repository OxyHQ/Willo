# The backend's tests, against a real Postgres.
#
# packages/backend's service tests run against a real database, so they need
# one: a disposable postgres:17-alpine service container (the image
# docker-compose.postgres.yml runs locally), migrated with the backend's own
# `db:migrate` before the suite runs. TUNNEL_CLAIM_ENCRYPTION_KEY is a fresh
# random 32-byte key per run; nothing here is a secret.
#
# Its own workflow, with no path filter, for the same reason as
# reviewed-image.yml: ui-checks.yml only runs for some paths, and a required
# check must report on EVERY pull request or a PR that skips it waits forever.
name: Backend tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: willo
          POSTGRES_PASSWORD: willo
          POSTGRES_DB: willo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U willo -d willo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: '1'
      DATABASE_URL: postgres://willo:willo@127.0.0.1:5432/willo_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Apply the migrations
        working-directory: packages/backend
        run: bun run db:migrate
      - name: Run the backend tests
        working-directory: packages/backend
        run: |
          set -euo pipefail
          TUNNEL_CLAIM_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export TUNNEL_CLAIM_ENCRYPTION_KEY
          bun run test
