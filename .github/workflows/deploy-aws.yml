# Deploy the Willo backend (@willo.sh/backend) to AWS ECS Fargate.
#
# Modeled closely on ~/Oxy/Peable's own deploy-aws.yml (Bun-native image,
# mutable :latest task-definition reuse, OIDC -> ECR -> ECS). The ECR repo
# (oxy/willo) and the ECS service (willo on cluster oxy-cluster, port 4200)
# are provisioned in terraform (~/Oxy/oxy-infra); every AWS step below no-ops
# gracefully until the service exists, so the first push can run before the
# service is created (the image still lands in ECR).
#
# Two adaptations from Peable, both because this is the FIRST production
# deploy pipeline this backend has ever had:
#   - No packages/shared-types (Willo has none) in the trigger paths or the
#     image.
#   - One migration step, not a pre/post pair — see
#     .github/scripts/run-migration-task.sh for why: this backend's own
#     migrator has no phase concept to drive one.
name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - 'packages/backend/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-willo-backend
  # Serialize production rollouts. Cancelling after `update-service` would
  # leave an unmonitored deployment running in ECS.
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: willo
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Runtime secrets are NOT in GitHub. SSM Parameter Store (/oxy/willo/*,
      # SecureString) is their single source of truth: the task definition reads
      # them at task start, and nothing in this workflow writes one. Setting or
      # rotating a value is `aws ssm put-parameter --overwrite` by its owner
      # (oxy-infra docs/runbooks/46-app-secrets-in-ssm.md), never a repo secret.
      # A new one is written to SSM FIRST, then named in the task definition: a
      # task naming a missing parameter fails at start. Until 2026-10-10 a step
      # here copied GitHub repo secrets into SSM on every deploy.
      # tests/deploy-workflow-secrets.test.ts fails if a workflow writes SSM or
      # reads an app secret from GitHub again.
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # `--cache-from/--cache-to type=gha` below need the Actions runtime token
      # and cache URL, which GitHub gives to JavaScript actions and NOT to `run:`
      # steps; without them buildx skips the cache silently. Only a push to main
      # or a dispatch runs this workflow, so pull-request code never writes this
      # cache scope.
      - name: Expose the Actions cache to buildx
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4

      # Same Dockerfile, context, platform and tags as the plain `docker build`
      # this replaces, pushed in the same step. --provenance=false keeps the
      # pushed artefact a single-platform image manifest, as before, rather
      # than an index with an attestation.
      - name: Build and push (linux/arm64)
        id: build
        run: |
          set -euo pipefail
          IMG=$ECR_REGISTRY/oxy/$APP
          docker buildx build \
            --platform linux/arm64 \
            --cache-from type=gha,scope=$APP-backend \
            --cache-to type=gha,scope=$APP-backend,mode=max \
            --provenance=false \
            -f "$DOCKERFILE" \
            -t "$IMG:${{ github.sha }}" \
            -t "$IMG:latest" \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --push \
            .

          DIGEST=$(jq -r '.["containerimage.digest"] // empty' "$RUNNER_TEMP/build-metadata.json")
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::buildx produced no usable image digest"
            exit 1
          fi
          echo "image_uri=$IMG@$DIGEST" >> "$GITHUB_OUTPUT"

      # Registers a revision derived from the service's LIVE task definition
      # with only the image swapped for the digest just pushed, so the
      # migration task and the rollout both run exactly this build while
      # keeping the live secrets, role, subnets and security groups. The live
      # definition pins its image by digest, so `--force-new-deployment` alone
      # would restart the OLD image and report success.
      - name: Resolve the ECS one-shot shape
        id: ecs
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          set -euo pipefail

          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — nothing to migrate or deploy against"
            exit 0
          fi

          LIVE_TD=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].taskDefinition' --output text)
          NET=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].networkConfiguration' --output json)
          CONTAINER=$(aws ecs describe-task-definition --task-definition "$LIVE_TD" --query 'taskDefinition.containerDefinitions[0].name' --output text)
          RENDERED="$RUNNER_TEMP/task-definition.json"
          aws ecs describe-task-definition --task-definition "$LIVE_TD" --query taskDefinition --output json \
            | jq --arg container "$CONTAINER" --arg image "$IMAGE_URI" '
                .containerDefinitions |= map(if .name == $container then .image = $image else . end)
                | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                      .registeredAt, .registeredBy, .deregisteredAt)' > "$RENDERED"
          TD=$(aws ecs register-task-definition --cli-input-json "file://$RENDERED" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition=$TD" >> "$GITHUB_OUTPUT"
          echo "container=$CONTAINER" >> "$GITHUB_OUTPUT"
          # JSON on one line: a GITHUB_OUTPUT value cannot span lines unhelped.
          echo "network=$(echo "$NET" | jq -c .)" >> "$GITHUB_OUTPUT"

          # There is deliberately NO `DATABASE_URL` preflight here.
          #
          # It would only be useful while no route read Postgres, so a task
          # definition without the variable served fine and skipping
          # migrations was harmless. That is not the state of the world:
          # `config.ts` refuses to load without `DATABASE_URL` and
          # `server.ts` opens the pool before listening, so a task definition
          # missing it crash-loops instead of serving. Keeping the preflight
          # would answer a missing variable by SKIPPING the migration and
          # letting the rollout proceed to a service that cannot boot —
          # turning a loud configuration error into a silent one plus a
          # crash-loop with no migration applied.

      - name: Migrate — one-shot ECS task before the rollout
        if: steps.ecs.outputs.status == 'ACTIVE'
        run: .github/scripts/run-migration-task.sh
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
          CONTAINER_NAME: ${{ steps.ecs.outputs.container }}
          NETWORK_CONFIGURATION: ${{ steps.ecs.outputs.network }}

      - name: Deploy to ECS (rolling; skipped until the service exists)
        env:
          TASK_DEFINITION: ${{ steps.ecs.outputs.task_definition }}
        run: |
          set -euo pipefail

          # Poll the PRIMARY deployment's rolloutState instead of the fixed
          # `aws ecs wait services-stable` waiter (which caps at 10 min and
          # false-fails on a longer rollout + ALB drain).
          MAX_WAIT_SECS=1200   # 20 min hard cap before we call it a real timeout
          POLL_INTERVAL=15     # seconds between describe-services polls

          STATUS=$(aws ecs describe-services --cluster "$CLUSTER" --services "$APP" --query 'services[0].status' --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "ECS service $APP not created yet — image is in ECR, skipping deploy"
            exit 0
          fi

          aws ecs update-service --cluster "$CLUSTER" --service "$APP" --task-definition "$TASK_DEFINITION" >/dev/null
          echo "Triggered new deployment for $APP; polling rolloutState (timeout ${MAX_WAIT_SECS}s)..."

          elapsed=0
          while [ "$elapsed" -lt "$MAX_WAIT_SECS" ]; do
            # describe-services must not abort the loop on a transient error (set -e safe).
            DESC=$(aws ecs describe-services \
              --cluster "$CLUSTER" --services "$APP" \
              --query 'services[0].deployments[?status==`PRIMARY`]|[0].[rolloutState,runningCount,desiredCount]' \
              --output text 2>/dev/null) || DESC=""

            if [ -z "$DESC" ] || [ "$DESC" = "None" ]; then
              echo "  ($elapsed s) no PRIMARY deployment info yet, retrying..."
            else
              ROLLOUT_STATE=$(echo "$DESC" | awk '{print $1}')
              RUNNING=$(echo "$DESC" | awk '{print $2}')
              DESIRED=$(echo "$DESC" | awk '{print $3}')
              echo "  ($elapsed s) rolloutState=$ROLLOUT_STATE running=$RUNNING desired=$DESIRED"

              if [ "$ROLLOUT_STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ]; then
                echo "deployed $APP — rollout COMPLETED ($RUNNING/$DESIRED tasks running)"
                exit 0
              fi
              if [ "$ROLLOUT_STATE" = "FAILED" ]; then
                echo "::error::ECS rollout for $APP FAILED — see service events in the AWS console"
                exit 1
              fi
            fi

            sleep "$POLL_INTERVAL"
            elapsed=$((elapsed + POLL_INTERVAL))
          done

          echo "::error::ECS rollout for $APP did not reach COMPLETED within ${MAX_WAIT_SECS}s (genuine timeout)"
          exit 1
