name: UI validation
on:
  pull_request:
    paths:
      - 'packages/frontend/**'
      - 'packages/ui/**'
      - 'scripts/check-ui.mjs'
      - 'bun.lock'
      - '.github/workflows/ui-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Geometry, state, route and theme contracts
        run: node --experimental-strip-types --test packages/frontend/tests/*.test.mjs
      - name: Install the existing workspace lockfile
        run: bun install --frozen-lockfile
      - name: Typecheck the actual workspace
        run: bun run typecheck
      - name: Export the actual Expo web app
        working-directory: packages/frontend
        run: bun x expo export --platform web
        env:
          CI: '1'
      - name: Install isolated browser tooling
        run: |
          mkdir -p "$RUNNER_TEMP/willo-browser"
          printf '{"private":true,"dependencies":{"playwright":"1.55.0"}}' > "$RUNNER_TEMP/willo-browser/package.json"
          bun install --cwd "$RUNNER_TEMP/willo-browser"
          node "$RUNNER_TEMP/willo-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify real web routes, colors, layout and resize
        run: node scripts/check-ui.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/willo-browser/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: willo-web-ui-verification
          path: ui-artifacts/
          if-no-files-found: ignore
          retention-days: 14
