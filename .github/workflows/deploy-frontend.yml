name: Deploy frontend

on:
  # UI checks only runs on pull_request, never on a direct push to main, so
  # gating this on `workflow_run: [UI checks]` would never fire for a
  # push that lands on main outside a PR. Deploy on push directly instead.
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-willo-frontend
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'
  WRANGLER_VERSION: '4.130.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web export
        working-directory: packages/frontend
        run: bunx expo export --platform web
        env:
          EXPO_PUBLIC_OXY_API_URL: https://api.oxy.so
          # Public client id (ApplicationCredential publicKey, type 'public') —
          # safe to commit, same as Peable's own equivalent constant. Without
          # it, OxySignInButton's web OAuth flow no-ops with
          # `missing-client-id` and nobody can sign in to the deployed app.
          EXPO_PUBLIC_OXY_CLIENT_ID: oxy_dk_fb8d8c425643f2bd3983386674e9704d81746295d0a3345b
          EXPO_PUBLIC_OXY_AUTH_REDIRECT_URI: https://willo.sh
          # Willo's own backend — without it, every fetch in
          # providers/willo-tunnel.ts and state/home-context.tsx resolves to
          # literally "undefined" (Expo inlines a missing EXPO_PUBLIC_* var
          # as that string, not a real error), so every request 404s/405s
          # against https://willo.sh/undefined/... instead of the backend.
          EXPO_PUBLIC_WILLO_API_URL: https://api.willo.sh

      # Run through `bunx` directly, not `cloudflare/wrangler-action`: that
      # action resolves its own wrangler by looking for a lockfile in
      # `working-directory`, and `packages/frontend` has none (the lockfile
      # is at the repository root, this being a bun workspace), so it falls
      # back to npm and fails.
      - name: Deploy to Cloudflare
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bunx "wrangler@$WRANGLER_VERSION" deploy

      - name: Smoke test the deployed domain
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 --retry 5 --retry-delay 5 \
            --retry-all-errors --output /dev/null --write-out '%{http_code}' \
            https://willo.sh/)"
          if [[ "$code" != "200" ]]; then
            echo "::error::willo.sh answered HTTP $code after deploy."
            exit 1
          fi
          echo "willo.sh is live."
