name: Deploy frontend

on:
  workflow_run:
    workflows: [UI checks]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-willo-frontend
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'
  WRANGLER_VERSION: '4.130.0'

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the web export
        working-directory: packages/frontend
        run: bunx expo export --platform web
        env:
          EXPO_PUBLIC_OXY_API_URL: https://api.oxy.so

      # Run through `bunx` directly, not `cloudflare/wrangler-action`: that
      # action resolves its own wrangler by looking for a lockfile in
      # `working-directory`, and `packages/frontend` has none (the lockfile
      # is at the repository root, this being a bun workspace), so it falls
      # back to npm and fails.
      - name: Deploy to Cloudflare
        working-directory: packages/frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: bunx "wrangler@$WRANGLER_VERSION" deploy

      - name: Smoke test the deployed domain
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error --max-time 20 --retry 5 --retry-delay 5 \
            --retry-all-errors --output /dev/null --write-out '%{http_code}' \
            https://willo.sh/)"
          if [[ "$code" != "200" ]]; then
            echo "::error::willo.sh answered HTTP $code after deploy."
            exit 1
          fi
          echo "willo.sh is live."
